<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora">
    <div class="aurora__orb aurora__orb--1"></div>
    <div class="aurora__orb aurora__orb--2"></div>
    <div class="aurora__orb aurora__orb--3"></div>
  </div>

  <div class="card">
    <header class="card__header">
      <h1>STOPWATCH</h1>
    </header>

    <div class="timer-section">
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring__track" cx="120" cy="120" r="108"/>
        <circle class="ring__fill" id="ringFill" cx="120" cy="120" r="108"/>
      </svg>
      <div class="timer-inner">
        <div class="display" id="display">00:00.00</div>
        <div class="lap-delta" id="lapDelta"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="startStop" class="btn btn--primary">スタート</button>
      <button id="lap" class="btn btn--secondary" disabled>ラップ</button>
      <button id="reset" class="btn btn--secondary" disabled>リセット</button>
    </div>

    <div class="shortcuts">
      <span><kbd>Space</kbd>開始/停止</span>
      <span><kbd>L</kbd>ラップ</span>
      <span><kbd>R</kbd>リセット</span>
    </div>

    <div class="lap-toolbar" id="lapToolbar" hidden>
      <span class="lap-toolbar__title">ラップ記録</span>
      <button class="btn-icon" id="copyBtn" title="クリップボードにコピー">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        コピー
      </button>
    </div>
    <ul id="lapList" class="lap-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
